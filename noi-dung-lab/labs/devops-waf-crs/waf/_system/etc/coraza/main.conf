# Load order is IMPORTANT:
#   1. coraza.conf        - engine configuration (SecRuleEngine, audit log...)
#   2. crs-setup.conf     - CRS configuration (paranoia level, anomaly threshold)
#   3. custom-rules.conf  - student's rules/exclusions (run before CRS)
#   4. crs/rules/*.conf   - all OWASP CRS rules
Include /etc/coraza/coraza.conf
Include /etc/coraza/crs/crs-setup.conf
Include /etc/coraza/custom-rules.conf
Include /etc/coraza/crs/rules/*.conf

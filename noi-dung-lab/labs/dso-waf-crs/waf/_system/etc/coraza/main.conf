# Thu tu nap QUAN TRONG:
#   1. coraza.conf        - cau hinh engine (SecRuleEngine, audit log...)
#   2. crs-setup.conf     - cau hinh CRS (paranoia level, anomaly threshold)
#   3. custom-rules.conf  - rule/exclusion cua sinh vien (chay truoc CRS)
#   4. crs/rules/*.conf   - toan bo rule OWASP CRS
Include /etc/coraza/coraza.conf
Include /etc/coraza/crs/crs-setup.conf
Include /etc/coraza/custom-rules.conf
Include /etc/coraza/crs/rules/*.conf
